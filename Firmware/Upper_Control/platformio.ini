[env:PEGASUS]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_protocol = esptool

board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600   ; app0 partition size (0x640000)
board_build.partitions = partitions.csv
; N16R2 Configuration: Quad-SPI Flash and Quad-SPI PSRAM (saves user I/O pins)
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qio

monitor_speed = 115200
monitor_filters = send_on_enter

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0   ; silence ESP-IDF/Arduino core [W]/[E] chatter (e.g. WiFiGeneric NO_AP_FOUND) — our Logger only
    -Wall
    -Wextra
    -Werror
    -fno-exceptions
    -I ./wifi
    -I ../ctl-qlcp-lib/include

build_src_filter =
    +<*>
    +<../wifi>
    +<../../ctl-qlcp-lib/src>

lib_extra_dirs =
    ; Local libraries + workspace av-libraries (aim_network, aim_logger, aim_flash_storage).
    ../libraries/
    ../../../av-libraries/
